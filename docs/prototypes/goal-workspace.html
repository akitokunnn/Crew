<div id="crew-goal-trial" aria-label="Crew 目标工作区交互预览">
  <style>
    #crew-goal-trial{--ct-bg:light-dark(#fafaf8,#171a17);--ct-side:light-dark(#f0f1ec,#1e231e);--ct-paper:light-dark(#ffffff,#242a24);--ct-ink:light-dark(#263029,#e7eee6);--ct-muted:light-dark(#69756b,#a9b6a8);--ct-line:light-dark(#dfe5dc,#3a453a);--ct-hover:light-dark(#e8ede5,#303b2f);--ct-accent:light-dark(#294b37,#b3d5b8);--ct-on:light-dark(#ffffff,#172a1c);--ct-soft:light-dark(#e8f0e8,#2c3c2e);--ct-warn:light-dark(#876125,#edc586);--ct-warn-bg:light-dark(#faf3e5,#3c3121);--ct-red:light-dark(#945b52,#e1afa2);--ct-red-bg:light-dark(#f7eeea,#3b2b27);font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;color:var(--ct-ink);width:100%;background:transparent;color-scheme:light dark}
    #crew-goal-trial *{box-sizing:border-box}
    #crew-goal-trial [hidden]{display:none!important}
    #crew-goal-trial button,#crew-goal-trial input,#crew-goal-trial textarea{font:inherit;color:inherit}
    #crew-goal-trial button{cursor:inherit}
    #crew-goal-trial button:disabled{opacity:.5;cursor:default}
    #crew-goal-trial h2,#crew-goal-trial h3,#crew-goal-trial p{margin:0}
    #crew-goal-trial h2{font-size:23px;font-weight:500;line-height:1.4;letter-spacing:-.6px}
    #crew-goal-trial h3{font-size:15px;font-weight:500;line-height:1.5}
    #crew-goal-trial strong{font-weight:500}
    #crew-goal-trial .ct-window{border:1px solid var(--ct-line);border-radius:13px;background:var(--ct-bg);overflow:hidden}
    #crew-goal-trial .ct-top{display:flex;align-items:center;gap:10px;padding:11px 110px 11px 17px;border-bottom:1px solid var(--ct-line);min-height:49px;background:var(--ct-side)}
    #crew-goal-trial .ct-mark{width:23px;height:23px;display:grid;place-items:center;background:var(--ct-accent);color:var(--ct-on);border-radius:7px;font-weight:500;font-size:16px}
    #crew-goal-trial .ct-slash{color:var(--ct-muted);margin:0 2px}
    #crew-goal-trial .ct-demo{font-size:11px;color:var(--ct-muted);margin-left:8px}
    #crew-goal-trial .ct-layout{display:grid;grid-template-columns:172px minmax(0,1fr);min-height:690px}
    #crew-goal-trial aside{background:var(--ct-side);padding:23px 11px 18px;border-right:1px solid var(--ct-line);display:flex;flex-direction:column;gap:26px;min-width:0}
    #crew-goal-trial .ct-section{font-size:11px;color:var(--ct-muted);padding:0 12px 7px}
    #crew-goal-trial .ct-nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:7px;padding:9px 11px;text-align:left;margin-bottom:4px;min-height:38px}
    #crew-goal-trial .ct-nav:hover{background:var(--ct-hover)}
    #crew-goal-trial .ct-nav[aria-current="page"]{background:var(--ct-hover);font-weight:500}
    #crew-goal-trial .ct-nav i,#crew-goal-trial .ct-nav svg{width:16px;height:16px;flex:none}
    #crew-goal-trial .ct-count{margin-left:auto;font-size:11px;color:var(--ct-muted);font-variant-numeric:tabular-nums}
    #crew-goal-trial .ct-avatar{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ct-paper);border:1px solid var(--ct-line);font-size:11px;color:var(--ct-muted);flex:none}
    #crew-goal-trial .ct-side-note{font-size:11px;color:var(--ct-muted);padding:0 12px;margin-top:auto}
    #crew-goal-trial main{min-width:0;padding:29px 30px 18px}
    #crew-goal-trial .ct-heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:23px}
    #crew-goal-trial .ct-sub{font-size:12px;color:var(--ct-muted);margin-top:7px}
    #crew-goal-trial .ct-button{border:1px solid var(--ct-line);border-radius:7px;background:var(--ct-paper);padding:7px 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;text-align:center;font-size:12px;flex:none}
    #crew-goal-trial .ct-button:hover{background:var(--ct-hover)}
    #crew-goal-trial .ct-button i,#crew-goal-trial .ct-button svg{width:14px;height:14px;flex:none}
    #crew-goal-trial .ct-primary{background:var(--ct-accent);color:var(--ct-on);border-color:var(--ct-accent)}
    #crew-goal-trial .ct-primary:hover{opacity:.88;background:var(--ct-accent)}
    #crew-goal-trial .ct-link{padding:4px 0;border:0;background:transparent;color:var(--ct-muted);display:inline-flex;gap:5px;align-items:center;font-size:12px}
    #crew-goal-trial .ct-link:hover{color:var(--ct-ink)}
    #crew-goal-trial .ct-link i,#crew-goal-trial .ct-link svg{width:14px;height:14px}
    #crew-goal-trial .ct-list{display:flex;flex-direction:column;gap:12px}
    #crew-goal-trial .ct-goal{background:var(--ct-paper);border:1px solid var(--ct-line);border-radius:10px;padding:18px 19px;position:relative}
    #crew-goal-trial .ct-goal.attention{border-color:var(--ct-warn)}
    #crew-goal-trial .ct-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    #crew-goal-trial .ct-status{font-size:11px;display:inline-flex;align-items:center;gap:6px;color:var(--ct-muted)}
    #crew-goal-trial .ct-status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    #crew-goal-trial .ct-status.attention{color:var(--ct-warn)}
    #crew-goal-trial .ct-status.working{color:var(--ct-accent)}
    #crew-goal-trial .ct-status.failed{color:var(--ct-red)}
    #crew-goal-trial .ct-owner{font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-goal h3{margin-top:10px;margin-bottom:6px;font-size:16px}
    #crew-goal-trial .ct-desc{font-size:13px;color:var(--ct-muted)}
    #crew-goal-trial .ct-card-bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:17px;flex-wrap:wrap}
    #crew-goal-trial .ct-next{font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-footnote{margin-top:22px;color:var(--ct-muted);font-size:11px}
    #crew-goal-trial .ct-back{margin-bottom:19px}
    #crew-goal-trial .ct-detail-title{margin:10px 0 9px;font-size:21px;line-height:1.4;font-weight:500;letter-spacing:-.4px}
    #crew-goal-trial .ct-divider{border:0;border-top:1px solid var(--ct-line);margin:22px 0}
    #crew-goal-trial .ct-tabs{display:flex;gap:21px;border-bottom:1px solid var(--ct-line);margin:23px 0 20px}
    #crew-goal-trial .ct-tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:9px 0;font-size:12px;color:var(--ct-muted)}
    #crew-goal-trial .ct-tab[aria-selected="true"]{border-bottom-color:var(--ct-accent);color:var(--ct-ink);font-weight:500}
    #crew-goal-trial .ct-verdict{padding:17px 18px;background:var(--ct-red-bg);border-radius:8px;margin-bottom:21px}
    #crew-goal-trial .ct-verdict strong{display:block;font-size:16px;margin-bottom:5px}
    #crew-goal-trial .ct-verdict p{font-size:13px;color:var(--ct-muted)}
    #crew-goal-trial .ct-facts{display:grid;grid-template-columns:84px minmax(0,1fr);gap:15px 16px;font-size:13px;margin:0}
    #crew-goal-trial .ct-facts dt{color:var(--ct-muted)}
    #crew-goal-trial .ct-facts dd{margin:0;overflow-wrap:anywhere}
    #crew-goal-trial .ct-file{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ct-line);width:100%;background:transparent;border-top:0;border-left:0;border-right:0;text-align:left}
    #crew-goal-trial .ct-file i,#crew-goal-trial .ct-file svg{width:19px;height:19px;color:var(--ct-muted);flex:none}
    #crew-goal-trial .ct-file small{display:block;font-size:11px;color:var(--ct-muted);margin-top:2px}
    #crew-goal-trial .ct-file .ct-chevron{margin-left:auto}
    #crew-goal-trial .ct-steps{padding-left:19px;font-size:13px;margin:0}
    #crew-goal-trial .ct-steps li{padding:0 0 15px 5px}
    #crew-goal-trial .ct-steps small{display:block;color:var(--ct-muted);font-size:12px;margin-top:3px}
    #crew-goal-trial details{margin-top:15px;font-size:12px;color:var(--ct-muted)}
    #crew-goal-trial summary{padding:7px 0}
    #crew-goal-trial .ct-log{border-left:2px solid var(--ct-line);padding-left:12px;margin-top:9px;font-size:12px}
    #crew-goal-trial .ct-chat{display:flex;flex-direction:column;gap:17px}
    #crew-goal-trial .ct-chat-label{font-size:11px;color:var(--ct-muted);margin-bottom:6px}
    #crew-goal-trial .ct-bubble{font-size:13px;padding:14px 16px;background:var(--ct-paper);border:1px solid var(--ct-line);border-radius:9px;max-width:100%;overflow-wrap:anywhere}
    #crew-goal-trial .ct-bubble p+p{margin-top:10px}
    #crew-goal-trial .ct-human{align-self:flex-end;max-width:90%}
    #crew-goal-trial .ct-human .ct-bubble{background:var(--ct-soft);border-color:transparent}
    #crew-goal-trial .ct-replies{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
    #crew-goal-trial .ct-question{padding:17px;border:1px solid var(--ct-warn);border-radius:9px;background:var(--ct-paper)}
    #crew-goal-trial .ct-question h3{margin:5px 0 8px}

    #crew-goal-trial .ct-option em{font-size:11px;font-style:normal;color:var(--ct-accent);margin-left:6px}
    #crew-goal-trial .ct-confirmed{background:var(--ct-soft);padding:18px;border-radius:9px;font-size:13px}
    #crew-goal-trial .ct-confirmed strong{display:block;margin-bottom:6px}
    #crew-goal-trial .ct-composer{margin-top:20px}
    #crew-goal-trial textarea{display:block;width:100%;resize:vertical;min-height:85px;background:var(--ct-paper);border:1px solid var(--ct-line);border-radius:8px;padding:11px 12px;font-size:13px}
    #crew-goal-trial .ct-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
    #crew-goal-trial .ct-notice{color:var(--ct-muted);font-size:12px;margin-top:15px;overflow-wrap:anywhere}
    #crew-goal-trial .ct-empty{padding:35px 0;color:var(--ct-muted);font-size:13px}
    #crew-goal-trial .ct-checkline{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 0;border-bottom:1px solid var(--ct-line)}
    #crew-goal-trial .ct-checkline span:last-child{margin-left:auto;color:var(--ct-muted);font-size:11px;flex:none}
    #crew-goal-trial .ct-checkline i,#crew-goal-trial .ct-checkline svg{width:16px;height:16px;color:var(--ct-muted);flex:none;margin-top:2px}
    #crew-goal-trial .ct-document{font-size:13px}
    #crew-goal-trial .ct-document h3{margin:22px 0 7px}
    #crew-goal-trial .ct-document p{color:var(--ct-muted)}
    #crew-goal-trial .ct-document ul{padding-left:19px}
    #crew-goal-trial .ct-pause{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px;padding-top:17px;border-top:1px solid var(--ct-line)}
    #crew-goal-trial .ct-budget{margin:14px 0;color:var(--ct-muted);font-size:12px}
    #crew-goal-trial .ct-budget input{background:var(--ct-paper);border:1px solid var(--ct-line);border-radius:5px;padding:6px 8px;width:125px;max-width:100%;margin-top:8px}
    #crew-goal-trial .ct-tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
    #crew-goal-trial .ct-split{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:22px;align-items:start}
    #crew-goal-trial .ct-people{border-left:1px solid var(--ct-line);padding-left:14px;min-width:0}
    #crew-goal-trial .ct-person{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:7px;width:100%;text-align:left;padding:9px 7px;margin-top:6px;font-size:12px;min-height:44px}
    #crew-goal-trial .ct-person[aria-pressed="true"]{background:var(--ct-hover)}
    #crew-goal-trial .ct-person small{display:block;font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-examples{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
    #crew-goal-trial .ct-state-note{font-size:12px;padding:12px 14px;background:var(--ct-soft);border-radius:7px;margin:15px 0}
    #crew-goal-trial .ct-context-item{padding:15px 0;border-bottom:1px solid var(--ct-line);font-size:13px}
    #crew-goal-trial .ct-context-item p{margin-top:7px}
    #crew-goal-trial .ct-context-item small{font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-memory-excluded{color:var(--ct-muted);text-decoration:line-through}
    #crew-goal-trial .ct-lane{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;margin:12px 0;font-size:12px}
    #crew-goal-trial .ct-segments{display:flex;gap:4px;min-width:0}
    #crew-goal-trial .ct-segment{flex:1;text-align:center;background:var(--ct-soft);border-radius:4px;padding:10px 5px;min-width:0;overflow-wrap:anywhere}
    #crew-goal-trial .ct-segment.wrong{background:var(--ct-red-bg)}
    #crew-goal-trial .ct-stage-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0;font-size:12px}
    #crew-goal-trial .ct-stage{background:var(--ct-side);padding:12px 10px;border-radius:7px;min-width:0}
    #crew-goal-trial .ct-stage.active{background:var(--ct-soft)}
    #crew-goal-trial .ct-stage small{display:block;font-size:11px;color:var(--ct-muted);margin-top:5px}
    #crew-goal-trial .ct-workspace{display:grid;grid-template-columns:minmax(0,1fr);min-width:0}
    #crew-goal-trial .ct-workspace.with-team{grid-template-columns:minmax(0,1fr) 210px}
    #crew-goal-trial .ct-group-rail{background:var(--ct-side);border-left:1px solid var(--ct-line);padding:21px 12px;min-width:0}
    #crew-goal-trial .ct-rail-title{display:flex;justify-content:space-between;gap:7px;align-items:center;margin-bottom:12px;font-size:13px}
    #crew-goal-trial .ct-rail-title strong{overflow-wrap:anywhere}
    #crew-goal-trial .ct-roster{display:flex;flex-direction:column;gap:8px}
    #crew-goal-trial .ct-node{display:block;width:100%;background:var(--ct-paper);border:1px solid var(--ct-line);border-radius:8px;padding:12px;text-align:left;color:var(--ct-ink);font-size:13px;min-width:0}
    #crew-goal-trial .ct-node:hover,#crew-goal-trial .ct-node[aria-pressed="true"]{background:var(--ct-hover)}
    #crew-goal-trial .ct-node-leader{background:var(--ct-soft)}
    #crew-goal-trial .ct-node-name{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #crew-goal-trial .ct-node-name strong{overflow-wrap:anywhere}
    #crew-goal-trial .ct-node small{display:block;color:var(--ct-muted);font-size:11px;margin-top:5px;overflow-wrap:anywhere}
    #crew-goal-trial .ct-node-task{display:block;font-size:12px;margin-top:8px;overflow-wrap:anywhere}
    #crew-goal-trial .ct-node-state{font-size:11px;margin-left:auto;color:var(--ct-muted)}

    #crew-goal-trial .ct-tree-members{display:flex;flex-direction:column;gap:10px;padding:13px 0 0 16px;margin-left:13px;border-left:1px solid var(--ct-line)}
    #crew-goal-trial .ct-tree-member{position:relative}
    #crew-goal-trial .ct-tree-member:before{content:"";position:absolute;top:24px;left:-16px;width:16px;border-top:1px solid var(--ct-line)}
    #crew-goal-trial .ct-groups-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px;align-items:start}
    #crew-goal-trial .ct-group-column{min-width:0}
    #crew-goal-trial .ct-group-column-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:13px;color:var(--ct-muted);font-size:12px}
    #crew-goal-trial .ct-priority{background:var(--ct-warn-bg);color:var(--ct-warn);border-radius:4px;padding:1px 5px;font-size:11px;flex:none}
    #crew-goal-trial .ct-mini-label{font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-side-bottom{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--ct-line);font-size:11px;color:var(--ct-muted)}
    #crew-goal-trial .ct-side-bottom .ct-link{font-size:11px}
    #crew-goal-trial .ct-away{display:flex;gap:7px;align-items:center;margin-top:10px}
    #crew-goal-trial .ct-away input{accent-color:var(--ct-accent)}
    #crew-goal-trial .ct-sidebar-extras{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}
    #crew-goal-trial .ct-group-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--ct-line);font-size:12px}
    #crew-goal-trial .ct-group-strip .ct-tools{margin:0}
    #crew-goal-trial .ct-local-tray{margin:0 0 20px;color:var(--ct-ink)}
    #crew-goal-trial .ct-local-tray summary{font-size:12px;color:var(--ct-muted)}
    #crew-goal-trial .ct-goal-short{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--ct-line);background:transparent;text-align:left;font-size:12px}
    #crew-goal-trial .ct-goal-short span:last-child{font-size:11px;color:var(--ct-muted);flex:none}
    #crew-goal-trial .ct-rail-section{margin-top:21px;padding-top:15px;border-top:1px solid var(--ct-line)}
    #crew-goal-trial .ct-rail-section .ct-file{font-size:12px;align-items:flex-start;gap:7px}
    #crew-goal-trial .ct-rail-section .ct-file small{font-size:11px}
    #crew-goal-trial .ct-rail-section .ct-button{width:100%;justify-content:flex-start;font-size:12px;margin-top:10px}
    #crew-goal-trial .ct-layout>aside{gap:20px}
    #crew-goal-trial .ct-header-admin{margin-left:auto}
    #crew-goal-trial .ct-side-teams .ct-nav{font-size:12px;gap:7px}
    #crew-goal-trial .ct-button[aria-pressed="true"]{background:var(--ct-hover)}
    @media(max-width:850px){#crew-goal-trial .ct-workspace.with-team{grid-template-columns:minmax(0,1fr) 180px}#crew-goal-trial .ct-group-rail{padding:18px 9px}#crew-goal-trial .ct-node{padding:10px}#crew-goal-trial .ct-workspace.with-team main{padding-left:16px;padding-right:16px}}
    @media(max-width:700px){#crew-goal-trial .ct-workspace.with-team{grid-template-columns:minmax(0,1fr)}#crew-goal-trial .ct-group-rail{border-left:0;border-top:1px solid var(--ct-line)}#crew-goal-trial .ct-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#crew-goal-trial .ct-groups-grid{grid-template-columns:minmax(0,1fr)}#crew-goal-trial .ct-side-bottom{padding-top:12px}}
    @media(max-width:760px){#crew-goal-trial .ct-layout{grid-template-columns:145px minmax(0,1fr)}#crew-goal-trial main{padding:24px 19px 17px}#crew-goal-trial .ct-top{padding-right:100px}#crew-goal-trial .ct-demo{margin-left:0}#crew-goal-trial .ct-heading{gap:10px}#crew-goal-trial .ct-split{grid-template-columns:minmax(0,1fr)}#crew-goal-trial .ct-people{border-left:0;border-top:1px solid var(--ct-line);padding:12px 0 0;display:flex;flex-wrap:wrap;gap:7px}#crew-goal-trial .ct-person{width:auto}#crew-goal-trial .ct-stage-flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:540px){#crew-goal-trial .ct-layout{grid-template-columns:minmax(0,1fr);min-height:0}#crew-goal-trial aside{border-right:0;border-bottom:1px solid var(--ct-line);padding:10px;display:block}#crew-goal-trial aside nav{display:flex;gap:4px;flex-wrap:wrap}#crew-goal-trial .ct-nav{width:auto;margin:0;flex:1;justify-content:center;padding:8px 7px;font-size:12px}#crew-goal-trial .ct-side-teams,#crew-goal-trial .ct-side-note{display:none}#crew-goal-trial main{padding:23px 16px 17px}#crew-goal-trial h2{font-size:21px}#crew-goal-trial .ct-top{flex-wrap:wrap;gap:7px;padding-right:100px}#crew-goal-trial .ct-demo{width:100%;padding-left:30px}#crew-goal-trial .ct-heading{flex-wrap:wrap}#crew-goal-trial .ct-goal{padding:16px}#crew-goal-trial .ct-facts{grid-template-columns:minmax(0,1fr);gap:4px}#crew-goal-trial .ct-facts dd{margin-bottom:11px}#crew-goal-trial .ct-tabs{gap:17px}#crew-goal-trial .ct-detail-title{font-size:19px}#crew-goal-trial .ct-human{max-width:96%}}
    @media(pointer:coarse){#crew-goal-trial .ct-button,#crew-goal-trial .ct-link,#crew-goal-trial .ct-nav,#crew-goal-trial .ct-tab{min-height:44px}#crew-goal-trial textarea{font-size:16px}}
  </style>
  <div class="ct-window">
    <header class="ct-top"><span class="ct-mark" aria-hidden="true">C</span><strong>Crew</strong><span class="ct-slash">/</span><span>MIB</span><span class="ct-demo">交互预览 · 状态均为示例</span><button type="button" class="ct-link ct-header-admin cursor-interaction" data-nav="operations"><i data-lucide="shield-check" aria-hidden="true"></i>系统运维</button></header>
    <div class="ct-layout">
      <aside aria-label="工作区导航">
        <nav aria-label="工作区页面">
          <button type="button" class="ct-nav cursor-interaction" data-nav="all" aria-current="page"><i data-lucide="network" aria-hidden="true"></i>全部</button>
          <button type="button" class="ct-nav cursor-interaction" data-nav="channel"><i data-lucide="messages-square" aria-hidden="true"></i>交流区</button>
          <button type="button" class="ct-nav cursor-interaction" data-nav="git"><i data-lucide="git-branch" aria-hidden="true"></i>Git</button>
          <button type="button" class="ct-nav cursor-interaction" data-nav="todos"><i data-lucide="list-checks" aria-hidden="true"></i>我的待办</button>
        </nav>
        <div class="ct-side-teams" id="ct-leader-list"></div>
        <div class="ct-side-bottom"><div>额度 · 本预览未采集</div><p class="ct-notice">QQ · 状态示意</p><label class="ct-away"><input type="checkbox" id="ct-away">我已离开</label><div class="ct-sidebar-extras"><button type="button" class="ct-link cursor-interaction" data-nav="adopt">待收编</button><button type="button" class="ct-link cursor-interaction" data-nav="usage">用量</button><button type="button" class="ct-link cursor-interaction" data-nav="settings">设置</button></div></div>
      </aside>
      <div class="ct-workspace" id="ct-workspace"><main id="ct-content"></main><section class="ct-group-rail" id="ct-group-panel" aria-label="当前组的常驻成员与资料" hidden></section></div>
    </div>
  </div>
  <div id="ct-announcement" class="ct-notice" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const root=document.getElementById('crew-goal-trial');
      const main=root.querySelector('#ct-content');
      const announcement=root.querySelector('#ct-announcement');
      const display={showProgress:true};
      const teams=[
        {id:'voice',name:'语音和声纹',mark:'声',leader:{id:'voice-leader',name:'语音和声纹',role:'leader',runtime:'claude',working:false,task:'协调三场景验收与后续工作',goal:'speaker'},members:[{id:'voice-build',name:'声纹施工',role:'成员',runtime:'codex',working:false,task:'代码和评测已保留，等待新安排',goal:'speaker'},{id:'voice-check',name:'声纹识别实际',role:'成员',runtime:'claude',working:false,task:'已记录短句与混说的失败边界',goal:'speaker'}]},
        {id:'performance',name:'性能优化',mark:'性',leader:{id:'performance-leader',name:'性能优化',role:'leader',runtime:'claude',working:true,task:'定位唤醒到首句的主要等待',goal:'latency'},members:[{id:'performance-test',name:'延迟复测',role:'成员',runtime:'codex',working:true,task:'对比相同输入的冷启动和热启动',goal:'latency'}]}
      ];
      const people=teams.flatMap(team=>[team.leader,...team.members].map(person=>({...person,group:team.id})));
      const state={schema:2,nav:'all',group:null,pane:'goals',allTab:'tree',activeGoal:null,person:null,priority:['voice'],away:false,selected:null,tab:'outcome',step:0,choice:null,option:'results',paused:false,draft:'',supplements:[],custom:[],customGroups:[],document:null,chats:{},chatDrafts:{},personRuntimes:{},memoryPending:false,memoryExcluded:false,opsStep:0,reportCase:0,runtimePreview:false};
      const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const button=(label,action,primary=false,icon='')=>`<button type="button" class="ct-button ${primary?'ct-primary ':''}cursor-interaction" data-act="${action}">${icon?`<i data-lucide="${icon}" aria-hidden="true"></i>`:''}${label}</button>`;
      const back=()=>`<button type="button" class="ct-link ct-back cursor-interaction" data-act="back"><i data-lucide="arrow-left" aria-hidden="true"></i>返回${state.group?'本组目标':'全部'}</button>`;
      const teamOf=id=>teams.find(team=>team.id===id);
      const currentPerson=()=>people.find(person=>person.id===state.person)||people.find(person=>person.group===state.group&&person.role==='leader');
      const runtimeOf=person=>state.personRuntimes[person.id]||person.runtime;
      const groupOfGoal=id=>id==='latency'?'performance':String(id).startsWith('new-')?state.customGroups[Number(id.slice(4))]||'voice':'voice';
      const shortGoalStatus=goal=>goal.id==='recording'?(state.choice?'已确认':'需要你'):goal.id==='latency'?(state.paused?'已暂停':'推进中'):goal.id==='speaker'?'未达标':'待规划';
      function enterGroup(group,pane='goals',goal=null){state.nav=group;state.group=group;state.pane=pane;state.selected=null;state.document=null;state.runtimePreview=false;state.activeGoal=goal;if(!people.some(person=>person.id===state.person&&person.group===group))state.person=teamOf(group).leader.id;}
      function openPerson(id){const person=people.find(item=>item.id===id);if(!person)return;const goal=person.role==='leader'&&state.group===person.group?state.activeGoal||person.goal:person.goal;enterGroup(person.group,'chat',goal);state.person=id;}
      function openGoal(id){enterGroup(groupOfGoal(id),'goals',id);state.selected=id;state.tab='outcome';}
      const goals=()=>[
        {id:'recording',title:'确认测试录音的保存范围',owner:'语音和声纹',type:state.choice?'working':'attention',status:state.choice?'本轮结束 · 已确认':'需要你聊一下',description:state.choice?(state.choice==='results'?'只保存评测结果，原始录音不长期保留。':'仅本地保留本轮录音，结束时再确认处理。'):'涉及你的资料使用偏好，leader 需要先听听你的想法。',next:state.choice?'决定已记录，不再反复询问':'这项已暂停；不影响其他目标继续',cta:state.choice?'查看决定':'听它说明',demo:true},
        {id:'latency',title:'缩短唤醒后的首句等待',owner:'性能优化',type:state.paused?'neutral':'working',status:state.paused?'已暂停':'正在推进',description:state.paused?'执行已暂停，保留当前结果，等你继续。':'正在对比冷启动与热启动，先定位时间花在哪一段。',next:state.paused?'不会再自行启动成员':'下一步：用相同输入复验优化效果',cta:'查看进展',demo:true},
        {id:'speaker',title:'三种对话场景正确分人、分段',owner:'语音和声纹',type:'failed',status:'本轮结束 · 未达标',description:'保留了本地评测与代码；短句和混说仍未满足最终要求。',next:'已收束，内部消息不会重新开启本轮',cta:'查看最终答复',demo:false},
        ...state.custom.map((title,index)=>({id:'new-'+index,title,owner:teamOf(groupOfGoal('new-'+index)).name,type:'neutral',status:'待规划 · 演示目标',description:'需求已保存在本次演示中，没有派发给真实 AI。',next:'开工前由 leader 制定交付与验收标准',cta:'查看需求',demo:true}))
      ];
      function remember(){
        if(!window.openai?.setWidgetState)return;
        const compactNotes=items=>items.slice(-2).map(note=>({text:note.text.slice(0,160),reply:note.reply.slice(0,160),changed:note.changed}));
        const privateState={...state,draft:state.draft.slice(0,200),supplements:state.supplements.slice(-2).map(text=>text.slice(0,300)),custom:state.custom.slice(-4).map(text=>text.slice(0,200)),chats:Object.fromEntries(Object.entries(state.chats).map(([id,items])=>[id,compactNotes(items)])),chatDrafts:Object.fromEntries(Object.entries(state.chatDrafts).map(([id,text])=>[id,text.slice(0,160)]))};
        while(new TextEncoder().encode(JSON.stringify(privateState)).length>14000){
          const chat=Object.keys(privateState.chats).find(id=>privateState.chats[id].length);
          if(chat){privateState.chats[chat].shift();continue;}
          const key=['supplements','custom'].find(name=>privateState[name].length);
          if(!key)break;privateState[key].shift();
        }
        const result=window.openai.setWidgetState({modelContent:{prototype:'Crew 渐进迭代',openedGroup:state.group,openedGoal:state.activeGoal,openedView:state.document||(state.group?state.pane:state.nav),openedPerson:state.person,decision:state.choice,homeShowsProgress:display.showProgress},privateContent:{crewGoalTrial:privateState}});
        result?.catch(()=>{});
      }
      function restore(saved){
        const value=saved?.privateContent?.crewGoalTrial;
        if(!value||typeof value!=='object')return;
        if(['results','local',null].includes(value.choice))state.choice=value.choice;
        if(Number.isInteger(value.step))state.step=Math.max(0,Math.min(3,value.step));
        state.paused=value.paused===true;
        if(Array.isArray(value.custom))state.custom=value.custom.filter(v=>typeof v==='string').slice(-4);
        if(Array.isArray(value.supplements))state.supplements=value.supplements.filter(v=>typeof v==='string').slice(-3);
        if(value.schema!==2)return;
        state.customGroups=state.custom.map((_,index)=>teamOf(value.customGroups?.[index])?value.customGroups[index]:'voice');
        if(['all','channel','git','todos','voice','performance','operations','adopt','usage','settings'].includes(value.nav))state.nav=value.nav;
        state.group=['voice','performance'].includes(state.nav)?state.nav:null;
        if(['goals','chat','documents','context'].includes(value.pane))state.pane=value.pane;
        for(const key of ['selected','activeGoal','tab','draft','document'])if(typeof value[key]==='string'||value[key]===null)state[key]=value[key];
        if(['tree','goals'].includes(value.allTab))state.allTab=value.allTab;
        if(Array.isArray(value.priority))state.priority=[...new Set(value.priority.filter(id=>teamOf(id)))].slice(0,3);
        state.away=value.away===true;
        if(people.some(person=>person.id===value.person&&person.group===state.group))state.person=value.person;
        else if(state.group)state.person=teamOf(state.group).leader.id;
        for(const person of people){
          const id=person.id;
          if(Array.isArray(value.chats?.[id]))state.chats[id]=value.chats[id].filter(note=>note&&typeof note.text==='string'&&typeof note.reply==='string').map(note=>({text:note.text.slice(0,600),reply:note.reply.slice(0,600),changed:note.changed===true})).slice(-3);
          if(typeof value.chatDrafts?.[id]==='string')state.chatDrafts[id]=value.chatDrafts[id].slice(0,600);
          if(['claude','codex'].includes(value.personRuntimes?.[id]))state.personRuntimes[id]=value.personRuntimes[id];
        }
        state.memoryPending=value.memoryPending===true;state.memoryExcluded=value.memoryExcluded===true;
        if(Number.isInteger(value.opsStep))state.opsStep=Math.max(0,Math.min(3,value.opsStep));
        if(Number.isInteger(value.reportCase))state.reportCase=Math.max(0,Math.min(2,value.reportCase));
      }
      function announce(text){announcement.textContent=text;}
      function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
      function personNode(person,compact=false){
        const working=person.working&&!(person.group==='performance'&&state.paused),rank=state.priority.indexOf(person.group)+1;
        return `<button type="button" class="ct-node ${person.role==='leader'?'ct-node-leader':''} cursor-interaction" data-act="person" data-person="${person.id}" aria-pressed="${state.pane==='chat'&&state.person===person.id}"><span class="ct-node-name"><span class="ct-avatar">${safe(person.name.slice(0,1))}</span><strong>${safe(person.name)}</strong>${person.role==='leader'&&rank?`<span class="ct-priority">${rank}</span>`:''}${compact?'':`<span class="ct-node-state ${working?'working':''}">${working?'工作中':person.group==='performance'&&state.paused?'已暂停':'空闲'}</span>`}</span><small>${person.role} · ${runtimeOf(person)==='codex'?'Codex':'Claude Code'}${compact?' · '+(working?'工作中':person.group==='performance'&&state.paused?'已暂停':'空闲'):''}</small><span class="ct-node-task">${safe(person.task)}</span></button>`;
      }
      function renderLeaders(){
        const ordered=[...teams].sort((a,b)=>(state.priority.includes(a.id)?state.priority.indexOf(a.id):99)-(state.priority.includes(b.id)?state.priority.indexOf(b.id):99));
        const item=team=>`<button type="button" class="ct-nav cursor-interaction" data-nav="${team.id}" ${state.group===team.id?'aria-current="page"':''}><span class="ct-avatar">${team.mark}</span>${team.name}${state.priority.includes(team.id)?`<span class="ct-priority">${state.priority.indexOf(team.id)+1}</span>`:''}</button>`;
        root.querySelector('#ct-leader-list').innerHTML=`<div class="ct-section">置顶 · 优先</div>${ordered.filter(team=>state.priority.includes(team.id)).map(item).join('')||'<div class="ct-section">还没有置顶</div>'}<div class="ct-section" style="margin-top:15px">LEADER</div>${ordered.filter(team=>!state.priority.includes(team.id)).map(item).join('')}`;
      }
      function overviewTabs(){return `<div class="ct-tools" aria-label="全部的视图"><button type="button" class="ct-button cursor-interaction" data-act="overview-tree" aria-pressed="${state.allTab==='tree'}">架构图</button><button type="button" class="ct-button cursor-interaction" data-act="overview-goals" aria-pressed="${state.allTab==='goals'}">目标进展 · ${goals().length}</button></div>`;}
      function architectureView(){
        return `<div class="ct-heading"><div><h2>全部</h2><p class="ct-sub">MIB · 2 个 leader，3 个成员 · 示例状态</p></div>${button('交给 Crew','new',true,'plus')}</div>${overviewTabs()}${!state.choice?`<button type="button" class="ct-link cursor-interaction" data-act="open" data-id="recording">语音和声纹：有一项需要先和你聊清楚</button>`:''}<div class="ct-groups-grid" style="margin-top:20px">${teams.map(team=>`<section class="ct-group-column" aria-label="${team.name}架构图"><div class="ct-group-column-head"><span>${team.name}</span><span>${team.members.length} 个成员</span></div>${personNode(people.find(person=>person.id===team.leader.id))}<div class="ct-tree-members">${team.members.map(person=>`<div class="ct-tree-member">${personNode(people.find(item=>item.id===person.id))}</div>`).join('')}</div><button type="button" class="ct-link cursor-interaction" data-act="team-goals" data-group="${team.id}" style="margin-top:14px">看本组 ${goals().filter(goal=>groupOfGoal(goal.id)===team.id).length} 个目标</button></section>`).join('')}</div><p class="ct-footnote">每个节点都可以直接进入对应人的对话。此页保留架构总览，目标进展在同页切换。</p>`;
      }
      function renderTeam(){
        const panel=root.querySelector('#ct-group-panel'),team=teamOf(state.group);
        root.querySelector('#ct-workspace').classList.toggle('with-team',Boolean(team));panel.hidden=!team;
        if(!team){panel.innerHTML='';return;}
        const goal=goals().find(item=>item.id===state.activeGoal);
        panel.innerHTML=`<div class="ct-rail-title"><strong>${team.name}</strong><span class="ct-mini-label">本组</span></div><div class="ct-roster">${personNode(people.find(person=>person.id===team.leader.id),true)}${team.members.map(person=>personNode(people.find(item=>item.id===person.id),true)).join('')}</div><div class="ct-rail-section"><strong class="ct-mini-label">本组目标</strong>${goals().filter(item=>groupOfGoal(item.id)===team.id).map(item=>`<button type="button" class="ct-goal-short cursor-interaction" data-act="open" data-id="${item.id}"><span>${safe(item.title)}</span><span>${shortGoalStatus(item)}</span></button>`).join('')}</div><div class="ct-rail-section"><strong class="ct-mini-label">本组交付物</strong>${team.id==='voice'?file('声纹阶段报告','三场景 · 结论与具体例子','speaker-report'):'<p class="ct-notice">这个示例目标还没有最终交付。</p>'}${button('本组交付物','group-documents',false,'files')}</div><div class="ct-rail-section"><strong class="ct-mini-label">${goal?'当前目标的上下文':'目标上下文'}</strong><p class="ct-notice">${goal?safe(goal.title):'打开目标后，查看它实际采用的需求和证据。'}</p><button type="button" class="ct-button cursor-interaction" data-act="group-context" ${goal?'':'disabled'}><i data-lucide="notebook-tabs" aria-hidden="true"></i>它记得什么</button></div>`;
      }
      function groupStrip(){const team=teamOf(state.group);return `<div class="ct-group-strip"><span>${team.name} · 本组工作区</span><div class="ct-tools">${button('本组目标','group-home')}<button type="button" class="ct-button cursor-interaction" data-act="priority-group">${state.priority.includes(team.id)?'取消置顶':'置顶 leader'}</button></div></div>`;}
      function cards(){
        let items=goals();
        if(state.nav==='attention')items=items.filter(g=>g.id==='recording'&&!state.choice);
        if(state.nav==='voice')items=items.filter(g=>g.owner==='语音和声纹');
        if(state.nav==='performance')items=items.filter(g=>g.owner==='性能优化');
        const title=({goals:'你的目标',attention:'需要你',voice:'语音和声纹',performance:'性能优化'})[state.nav]||'你的目标';
        const subtitle=state.nav==='attention'?'先把情况聊清楚，再决定。':'看结果离目标还有多远，过程由 leader 协调。';
        return `<div class="ct-heading"><div><h2>${title}</h2><p class="ct-sub">${subtitle}</p></div>${button('交给 Crew','new',true,'plus')}</div><div class="ct-list">${items.length?items.map(g=>`<article class="ct-goal ${g.type==='attention'?'attention':''}" aria-label="${safe(g.title)}"><div class="ct-row"><span class="ct-status ${g.type}">${safe(g.status)}</span><span class="ct-owner">${g.owner}${g.demo?' · 示例':''}</span></div><h3>${safe(g.title)}</h3>${display.showProgress?`<p class="ct-desc">${safe(g.description)}</p>`:''}<div class="ct-card-bottom"><span class="ct-next">${safe(g.next)}</span><button type="button" class="ct-button ${g.type==='attention'?'ct-primary ':''}cursor-interaction" data-act="open" data-id="${g.id}">${g.cta}<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div></article>`).join(''):'<div class="ct-empty">没有需要你处理的事项。leader 会自行推进其他目标。</div>'}</div><p class="ct-footnote">声纹结论摘自 10 月 24 日记录，其余任务和交互为演示。</p>`;
      }
      function heading(goal){return `${back()}<div class="ct-row"><span class="ct-status ${goal.type}">${safe(goal.status)}</span><span class="ct-owner">${goal.owner}</span></div><h2 class="ct-detail-title">${safe(goal.title)}</h2>`;}
      function tabs(){return `<div class="ct-tabs" role="tablist" aria-label="目标详情">${[['outcome','交付结论'],['evidence','验收依据'],['process','执行过程']].map(([id,label])=>`<button type="button" class="ct-tab cursor-interaction" role="tab" aria-selected="${state.tab===id}" aria-controls="ct-tab-panel" data-act="tab" data-tab="${id}" id="ct-tab-${id}">${label}</button>`).join('')}</div>`;}
      function speaker(){

      function documentsView(){return `<h2>本组交付物</h2><p class="ct-sub">${teamOf(state.group).name} · 报告绑定原目标，保留历史版本</p>${state.group==='voice'?file('声纹阶段交付报告','三场景 · 未达标 · 含具体例子','speaker-report'):'<p class="ct-empty">该示例目标还在验证，尚无最终报告。</p>'}`;}
      function speakerContext(){
        return `<div class="ct-heading"><div><h2>它记得什么</h2><p class="ct-sub">声纹三场景 · 本次采用的上下文示例</p></div></div><div class="ct-state-note">本版计划加入动态上下文。此页只演示检查、纠正与装载状态，不代表正式模型已采用。</div><div class="ct-context-item"><div class="ct-row"><strong>原始要求</strong><small>本目标 · 用户原话</small></div><p>停顿换人、紧接短句、交替混说，都要正确分人、切段和上行。</p><details><summary class="cursor-interaction">查看来源与装载理由</summary><p>来自原目标需求；作为本目标验收标准，每次工作必须带入，不受摘要覆盖。</p></details></div><div class="ct-context-item"><div class="ct-row"><strong>已确认决定</strong><small>本目标 · 明确约束</small></div><p>不要 PR，等着。</p><details><summary class="cursor-interaction">查看来源与范围</summary><p>来自旧目标内的明确用户指令。适用于此目标；不会自动扩散成整个 Crew 永远不发 PR 的规则。</p></details></div><div class="ct-context-item"><div class="ct-row"><strong>历史评测记录</strong><small>${state.memoryExcluded?'已从本次上下文排除':state.memoryPending?'纠正已保存 · 尚未装载':'历史事实 · 待核对时效'}</small></div><p class="${state.memoryExcluded?'ct-memory-excluded':''}">旧报告：已跑完 580 条评测覆盖，未确认全面正确率。</p><details><summary class="cursor-interaction">查看来源</summary><p>2026-10-24 的阶段报告；它只证明旧版本的覆盖，不能作为下一轮新版本已经通过的依据。</p></details><div class="ct-tools">${state.memoryExcluded?'<span class="ct-owner">旧条目仍保留在历史中。</span>':state.memoryPending?button('模拟下一次装载','memory-apply',true):button('标记这条已过期','memory-outdated')}</div></div><p class="ct-notice">普通纠正留在当前目标；明确说“以后都这样”才成为长期规则，并注明 leader／项目／Crew 范围。</p>`;
      }
      function operationsView(){
        const descriptions=['正常巡检由程序完成，没有调用运维 AI。','程序识别重复确认循环，暂停受影响目标的自动派发。','运维 AI 按事故读取现场，在隔离分支修复并验证；需要时重启服务。','演示恢复结束：原来运行的目标可以接续，用户手动暂停的目标保持暂停。'];
        const phases=[['监测','程序持续守护'],['收束异常','局部暂停并保留现场'],['修复','独立进程与分支'],['恢复','核对原运行状态']];
        return `<div class="ct-heading"><div><h2>系统运维</h2><p class="ct-sub">整个 Crew 一个 · 独立于 leader</p></div></div><div class="ct-state-note">故障演练 · 全部操作为本地示意，不重启服务、不修代码、不调用模型。</div><div class="ct-stage-flow" role="img" aria-label="故障流程：监测、收束异常、修复、恢复">${phases.map(([title,sub],index)=>`<div class="ct-stage ${index<=state.opsStep?'active':''}">${title}<small>${sub}</small></div>`).join('')}</div><h3>${['正常守护','发现消息循环','隔离修复与重启','已恢复 · 演示结果'][state.opsStep]}</h3><p class="ct-desc">${descriptions[state.opsStep]}</p><hr class="ct-divider"><dl class="ct-facts"><dt>受影响目标</dt><dd>${state.opsStep===0?'无 · 这是正常状态的示例':state.opsStep===3?'示例目标已解除故障；恢复前核对用户最新指令。':'仅暂停出现循环的示例目标，其他正常目标继续。'}</dd><dt>手动暂停</dt><dd>${state.paused?'首句等待目标：保持用户暂停。':'用户手动暂停的目标始终不会被此次恢复自动启动。'}</dd><dt>允许处理</dt><dd>重启自有服务、限制异常派发、修复 Crew 自身 bug。修复保留 commit，PR／合并遵循项目规则。</dd><dt>通知方式</dt><dd>结束后一次简报，附带有具体例子的 HTML 事故报告。巡检保持安静。</dd></dl><div class="ct-tools">${state.opsStep===0?button('模拟消息循环','ops-incident',true):state.opsStep===1?button('模拟隔离修复','ops-repair',true):state.opsStep===2?button('查看恢复结果','ops-recover',true):button('回到正常演示','ops-reset')}${state.opsStep===3?file('事故报告示例','怎么修、怎么验证、哪些目标被恢复','ops-report'):''}</div>`;
      }
      function render(){
        renderLeaders();
        for(const nav of root.querySelectorAll('[data-nav]')){if(nav.dataset.nav===state.nav)nav.setAttribute('aria-current','page');else nav.removeAttribute('aria-current');}
        root.querySelector('#ct-away').checked=state.away;
        let html;
        if(state.document)html=documentView();
        else if(state.selected==='new'||state.selected==='supplement')html=compose(state.selected==='new');
        else if(state.selected==='speaker')html=speaker();
        else if(state.selected==='recording')html=recording();
        else if(state.selected==='latency')html=latency();
        else if(state.selected?.startsWith('new-')){const goal=goals().find(item=>item.id===state.selected);html=goal?heading(goal)+`<p class="ct-desc">${safe(goal.title)}</p><p class="ct-notice">这是本地保存的演示目标，没有派发工作。</p>`:cards();}
        else if(state.group)html=state.pane==='chat'?scopedChat():state.pane==='documents'?documentsView():state.pane==='context'?scopedContext():cards();
        else if(state.nav==='all')html=state.allTab==='tree'?architectureView():overviewTabs()+cards();
        else if(state.nav==='operations')html=operationsView();
        else{const pages={channel:['交流区','保留项目内所有 leader 和用户的公共频道与未读入口。'],git:['Git','沿用提交树、分支、合并请求与 CI 的现有页面。'],todos:['我的待办','这里继续汇总需要你亲手操作的事项。示例中暂无人工操作待办；需要讨论的决定留在对应组。'],adopt:['待收编','继续支持发现和收编已有会话。'],usage:['用量','继续保留实际用量、额度与按结构查看的入口。'],settings:['设置','继续保留主题、字号、通知与现有设置。']};const [title,description]=pages[state.nav]||pages.channel;html=`<h2>${title}</h2><p class="ct-sub">${description}</p><div class="ct-state-note">现有功能保留。这张交互预览只演示本轮新增流程，不读取真实数据。</div>`;}
        main.innerHTML=(state.group?groupStrip():'')+html;renderTeam();icons();
      }
      function handleClick(event){
        const trigger=event.target.closest('button');if(!trigger||!root.contains(trigger))return;
        const nav=trigger.dataset.nav,action=trigger.dataset.act;
        if(nav){if(teamOf(nav))openPerson(teamOf(nav).leader.id);else{state.nav=nav;state.group=null;state.person=null;state.activeGoal=null;state.selected=null;state.document=null;state.runtimePreview=false;}}
        else if(action==='person')openPerson(trigger.dataset.person);
        else if(action==='team-goals')enterGroup(trigger.dataset.group);
        else if(action==='group-home'||action==='back'){if(state.group)enterGroup(state.group);else{state.nav='all';state.selected=null;state.document=null;}state.draft='';}
        else if(action==='overview-tree'||action==='overview-goals'){state.nav='all';state.group=null;state.selected=null;state.document=null;state.allTab=action==='overview-tree'?'tree':'goals';}
        else if(action==='priority-group'){const id=state.group;if(state.priority.includes(id))state.priority=state.priority.filter(item=>item!==id);else state.priority.push(id);announce('只更新本地演示中的置顶顺序。');}
        else if(action==='group-documents'){state.pane='documents';state.selected=null;state.document=null;}
        else if(action==='group-context'){state.pane='context';state.selected=null;state.document=null;}
        else if(action==='open')openGoal(trigger.dataset.id);
        else if(action==='tab')state.tab=trigger.dataset.tab;
        else if(action==='why')state.step=1;
        else if(action==='privacy')state.step=2;
        else if(action==='options')state.step=3;
        else if(action==='discuss')state.step=1;
        else if(action==='confirm'){state.choice=state.option;announce('演示决定已保存，没有操作真实录音。');}
        else if(action==='pause'){state.paused=true;announce('演示目标已暂停，没有中断真实进程。');}
        else if(action==='resume'){state.paused=false;announce('演示目标恢复推进，没有启动真实 AI。');}
        else if(action==='new'){enterGroup(state.group||'voice');state.selected='new';state.draft='';}
        else if(action==='supplement'){state.selected='supplement';state.draft='';}
        else if(action==='save-draft'){
          const form=root.querySelector('#ct-form');if(!form.reportValidity())return;const value=form.querySelector('#ct-draft').value.trim();if(!value)return;
          if(state.selected==='new'){state.custom.push(value);state.customGroups.push(state.group||'voice');openGoal('new-'+(state.custom.length-1));}else{state.supplements.push(value);openGoal('speaker');}state.draft='';announce('已保存在本地预览，没有派发真实任务。');
        }
        else if(action==='document'){if(trigger.dataset.doc==='speaker-report'){enterGroup('voice','documents','speaker');}state.document=trigger.dataset.doc;}
        else if(action==='report-case')state.reportCase=Number(trigger.dataset.index);
        else if(action==='member-chat'||action==='leader-chat'){const team=teamOf(state.group||'performance');openPerson(action==='leader-chat'?team.leader.id:team.members[0].id);}
        else if(action==='chat-question'||action==='chat-change'||action==='chat-send'){
          const person=currentPerson(),changed=action==='chat-change';let text;
          if(action==='chat-question')text=person.group==='performance'?'目前测到了什么？':'这轮哪些场景还没达标？';
          else if(changed)text=person.group==='performance'?'先测冷启动，热启动放后面。':'下一轮先验证混说，验收标准保持不变。';
          else{const form=root.querySelector('#ct-member-form');if(!form.reportValidity())return;text=form.querySelector('textarea').value.trim();if(!text)return;}
          const reply=changed?'收到你的补充。先按你指定的顺序核对，变更写回本目标，已有结果和验收标准保留。':action==='chat-question'?'我会先说明已有证据、未验证部分和下一步，再继续相应工作。这里是预设对话示例。':'这是预设演示回复。正式产品由当前同一个 AI 读取补充，先回应，再调整或继续工作。';
          state.chats[person.id]=[...(state.chats[person.id]||[]),{text,reply,changed}].slice(-3);state.chatDrafts[person.id]='';announce('只保存本地演示对话，没有调用真实 AI。');
        }
        else if(action==='runtime-preview')state.runtimePreview=true;
        else if(action==='runtime-cancel')state.runtimePreview=false;
        else if(action==='runtime-confirm'){const person=currentPerson();state.personRuntimes[person.id]=runtimeOf(person)==='codex'?'claude':'codex';state.runtimePreview=false;announce('只更新当前人物的演示载体，没有切换真实会话。');}
        else if(action==='memory-outdated')state.memoryPending=true;
        else if(action==='memory-apply'){state.memoryExcluded=true;state.memoryPending=false;}
        else if(action==='ops-incident')state.opsStep=1;
        else if(action==='ops-repair')state.opsStep=2;
        else if(action==='ops-recover')state.opsStep=3;
        else if(action==='ops-reset')state.opsStep=0;
        else return;
        render();remember();
      }
      root.addEventListener('click',handleClick);
      root.addEventListener('change',event=>{if(event.target.name==='ct-recording-choice'){state.option=event.target.value;remember();}if(event.target.id==='ct-away'){state.away=event.target.checked;remember();announce('仅改变演示中的离开状态，不修改真实 QQ 通知。');}});
      root.addEventListener('input',event=>{if(event.target.id==='ct-draft')state.draft=event.target.value;if(event.target.id==='ct-member-message'&&state.person)state.chatDrafts[state.person]=event.target.value;});
      root.addEventListener('submit',event=>event.preventDefault());
      restore(window.openai?.widgetState);render();
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();remember();}});tweak.addToggle(display,'showProgress',{label:'首页显示最近有效进展'});}
    })();
  </script>
</div>
