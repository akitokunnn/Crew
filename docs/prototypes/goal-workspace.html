    @media(max-width:760px){#crew-goal-trial .ct-layout{grid-template-columns:145px minmax(0,1fr)}#crew-goal-trial main{padding:24px 19px 17px}#crew-goal-trial .ct-top{padding-right:100px}#crew-goal-trial .ct-demo{margin-left:0}#crew-goal-trial .ct-heading{gap:10px}#crew-goal-trial .ct-split{grid-template-columns:minmax(0,1fr)}#crew-goal-trial .ct-people{border-left:0;border-top:1px solid var(--ct-line);padding:12px 0 0;display:flex;flex-wrap:wrap;gap:7px}#crew-goal-trial .ct-person{width:auto}#crew-goal-trial .ct-stage-flow{grid-template-columns:repeat(2,minmax(0,1fr))}}

  <div class="ct-window">
    <header class="ct-top"><span class="ct-mark" aria-hidden="true">C</span><strong>Crew</strong><span class="ct-slash">/</span><span>MIB</span><span class="ct-demo">交互预览 · 不执行真实任务</span></header>
    <div class="ct-layout">
      <aside aria-label="工作区导航">
        <nav aria-label="工作区页面">
          <button type="button" class="ct-nav cursor-interaction" data-nav="goals" aria-current="page"><i data-lucide="layers" aria-hidden="true"></i>目标<span class="ct-count" data-count="all">3</span></button>

          <button type="button" class="ct-nav cursor-interaction" data-nav="context"><i data-lucide="notebook-tabs" aria-hidden="true"></i>它记得什么</button>

        </nav>
        <div class="ct-side-teams"><div class="ct-section">LEADERS</div><button type="button" class="ct-nav cursor-interaction" data-nav="voice"><span class="ct-avatar">声</span>语音和声纹</button><button type="button" class="ct-nav cursor-interaction" data-nav="performance"><span class="ct-avatar">性</span>性能优化</button></div>

  <div id="ct-announcement" class="ct-notice" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const root=document.getElementById('crew-goal-trial');
      const main=root.querySelector('#ct-content');
      const announcement=root.querySelector('#ct-announcement');
      const display={showProgress:true};
      const state={nav:'goals',selected:null,tab:'outcome',step:0,choice:null,option:'results',paused:false,draft:'',supplements:[],custom:[],document:null,chatOwner:'member',memberNotes:[],leaderNotes:[],chatDrafts:{leader:'',member:''},memoryPending:false,memoryExcluded:false,opsStep:0,reportCase:0,runtime:'codex',leaderRuntime:'claude',runtimePreview:false};
      const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const button=(label,action,primary=false,icon='')=>`<button type="button" class="ct-button ${primary?'ct-primary ':''}cursor-interaction" data-act="${action}">${icon?`<i data-lucide="${icon}" aria-hidden="true"></i>`:''}${label}</button>`;
      const back=()=>`<button type="button" class="ct-link ct-back cursor-interaction" data-act="back"><i data-lucide="arrow-left" aria-hidden="true"></i>返回目标</button>`;
      const goals=()=>[
        {id:'recording',title:'确认测试录音的保存范围',owner:'语音和声纹',type:state.choice?'working':'attention',status:state.choice?'本轮结束 · 已确认':'需要你聊一下',description:state.choice?(state.choice==='results'?'只保存评测结果，原始录音不长期保留。':'仅本地保留本轮录音，结束时再确认处理。'):'涉及你的资料使用偏好，leader 需要先听听你的想法。',next:state.choice?'决定已记录，不再反复询问':'这项已暂停；不影响其他目标继续',cta:state.choice?'查看决定':'听它说明',demo:true},
        {id:'latency',title:'缩短唤醒后的首句等待',owner:'性能优化',type:state.paused?'neutral':'working',status:state.paused?'已暂停':'正在推进',description:state.paused?'执行已暂停，保留当前结果，等你继续。':'正在对比冷启动与热启动，先定位时间花在哪一段。',next:state.paused?'不会再自行启动成员':'下一步：用相同输入复验优化效果',cta:'查看进展',demo:true},
        {id:'speaker',title:'三种对话场景正确分人、分段',owner:'语音和声纹',type:'failed',status:'本轮结束 · 未达标',description:'保留了本地评测与代码；短句和混说仍未满足最终要求。',next:'已收束，内部消息不会重新开启本轮',cta:'查看最终答复',demo:false},
        ...state.custom.map((title,index)=>({id:'new-'+index,title,owner:'语音和声纹',type:'neutral',status:'待规划 · 演示目标',description:'需求已保存在本次演示中，没有派发给真实 AI。',next:'开工前由 leader 制定交付与验收标准',cta:'查看需求',demo:true}))
      ];
      function remember(){
        if(!window.openai?.setWidgetState)return;
        const compactNotes=items=>items.slice(-2).map(note=>({text:note.text.slice(0,180),reply:note.reply.slice(0,180),changed:note.changed}));

        let conversation=bubble(name+' · '+role+' · 预设演示','我正在用相同输入复验冷启动和热启动，确认等待主要发生在哪一段。你可以直接补充要求。');
        for(const note of notes)conversation+=bubble('你',safe(note.text),true)+bubble(name+' · 预设演示回复',safe(note.reply));
        return `${back()}<div class="ct-row"><div><span class="ct-status working">正在工作 · 交互示例</span><h2 class="ct-detail-title">${name}</h2></div>${button('查看交接与更换载体','runtime-preview',false,'arrow-left-right')}</div><p class="ct-sub">${role} · 首句等待示例目标 · ${runtime==='codex'?'Codex':'Claude Code'}</p><div class="ct-state-note">工作中可以插话。以下回复均为预设演示，不连接真实 AI。</div>${state.runtimePreview?`<section class="ct-question"><h3>更换为 ${runtime==='codex'?'Claude Code':'Codex'}？</h3><p class="ct-desc">身份和目标保留；原生历史各自保存。下次发消息会读取交接，可能增加用量。</p><details><summary class="cursor-interaction">交接预览</summary><p>目标：缩短首句等待。已有测量需复核，按最新要求调整测量顺序。保留原始验收标准和证据引用。</p></details><div class="ct-actions">${button('取消','runtime-cancel')}${button('确认演示切换','runtime-confirm',true)}</div><p class="ct-notice">这里只切换演示标签，正式版已有 leader 的切换尚未接通。</p></section>`:''}<div class="ct-split"><div><div class="ct-chat">${conversation}</div><div class="ct-examples">${button('问它正在测什么','chat-question')}${button('插话：先测冷启动','chat-change')}</div><form id="ct-member-form" class="ct-composer"><label class="ct-chat-label" for="ct-member-message">直接和 ${name} 说</label><textarea id="ct-member-message" required maxlength="600" placeholder="工作中也可以发消息。">${safe(state.chatDrafts[state.chatOwner])}</textarea><div class="ct-actions">${button('发送演示消息','chat-send',true,'arrow-up')}</div></form><p class="ct-notice">演示展示“同一 AI 接话再继续”的设计；正式实现需要分别验证 CC 和 Codex 的原生接收与实际回复。</p></div><div class="ct-people" aria-label="对话对象"><span class="ct-owner">本目标 · 示例角色</span><button type="button" class="ct-person cursor-interaction" aria-pressed="${isLeader}" data-act="chat-leader"><span class="ct-avatar">性</span><span>性能优化<small>leader</small></span></button><button type="button" class="ct-person cursor-interaction" aria-pressed="${!isLeader}" data-act="chat-member"><span class="ct-avatar">测</span><span>延迟复测<small>成员 · 工作中</small></span></button><details><summary class="cursor-interaction">leader 知道什么？</summary><p>${notes.some(note=>note.changed)?'演示：测量顺序的变更写回目标，leader 下次工作读取。':'关键任务变更写回目标，普通说明保留在成员对话。'}</p></details></div></div>`;
      }
      function contextView(){
        return `<div class="ct-heading"><div><h2>它记得什么</h2><p class="ct-sub">声纹三场景 · 本次采用的上下文示例</p></div></div><div class="ct-state-note">本版计划加入动态上下文。此页只演示检查、纠正与装载状态，不代表正式模型已采用。</div><div class="ct-context-item"><div class="ct-row"><strong>原始要求</strong><small>本目标 · 用户原话</small></div><p>停顿换人、紧接短句、交替混说，都要正确分人、切段和上行。</p><details><summary class="cursor-interaction">查看来源与装载理由</summary><p>来自原目标需求；作为本目标验收标准，每次工作必须带入，不受摘要覆盖。</p></details></div><div class="ct-context-item"><div class="ct-row"><strong>已确认决定</strong><small>本目标 · 明确约束</small></div><p>不要 PR，等着。</p><details><summary class="cursor-interaction">查看来源与范围</summary><p>来自旧目标内的明确用户指令。适用于此目标；不会自动扩散成整个 Crew 永远不发 PR 的规则。</p></details></div><div class="ct-context-item"><div class="ct-row"><strong>历史评测记录</strong><small>${state.memoryExcluded?'已从本次上下文排除':state.memoryPending?'纠正已保存 · 尚未装载':'历史事实 · 待核对时效'}</small></div><p class="${state.memoryExcluded?'ct-memory-excluded':''}">旧报告：已跑完 580 条评测覆盖，未确认全面正确率。</p><details><summary class="cursor-interaction">查看来源</summary><p>2026-10-24 的阶段报告；它只证明旧版本的覆盖，不能作为下一轮新版本已经通过的依据。</p></details><div class="ct-tools">${state.memoryExcluded?'<span class="ct-owner">旧条目仍保留在历史中。</span>':state.memoryPending?button('模拟下一次装载','memory-apply',true):button('标记这条已过期','memory-outdated')}</div></div><p class="ct-notice">普通纠正留在当前目标；明确说“以后都这样”才成为长期规则，并注明 leader／项目／Crew 范围。</p>`;
      }
      function operationsView(){
        const descriptions=['正常巡检由程序完成，没有调用运维 AI。','程序识别重复确认循环，暂停受影响目标的自动派发。','运维 AI 按事故读取现场，在隔离分支修复并验证；需要时重启服务。','演示恢复结束：原来运行的目标可以接续，用户手动暂停的目标保持暂停。'];
        const phases=[['监测','程序持续守护'],['收束异常','局部暂停并保留现场'],['修复','独立进程与分支'],['恢复','核对原运行状态']];
        return `<div class="ct-heading"><div><h2>系统运维</h2><p class="ct-sub">整个 Crew 一个 · 独立于 leader</p></div></div><div class="ct-state-note">故障演练 · 全部操作为本地示意，不重启服务、不修代码、不调用模型。</div><div class="ct-stage-flow" role="img" aria-label="故障流程：监测、收束异常、修复、恢复">${phases.map(([title,sub],index)=>`<div class="ct-stage ${index<=state.opsStep?'active':''}">${title}<small>${sub}</small></div>`).join('')}</div><h3>${['正常守护','发现消息循环','隔离修复与重启','已恢复 · 演示结果'][state.opsStep]}</h3><p class="ct-desc">${descriptions[state.opsStep]}</p><hr class="ct-divider"><dl class="ct-facts"><dt>受影响目标</dt><dd>${state.opsStep===0?'无 · 这是正常状态的示例':state.opsStep===3?'示例目标已解除故障；恢复前核对用户最新指令。':'仅暂停出现循环的示例目标，其他正常目标继续。'}</dd><dt>手动暂停</dt><dd>${state.paused?'首句等待目标：保持用户暂停。':'用户手动暂停的目标始终不会被此次恢复自动启动。'}</dd><dt>允许处理</dt><dd>重启自有服务、限制异常派发、修复 Crew 自身 bug。修复保留 commit，PR／合并遵循项目规则。</dd><dt>通知方式</dt><dd>结束后一次简报，附带有具体例子的 HTML 事故报告。巡检保持安静。</dd></dl><div class="ct-tools">${state.opsStep===0?button('模拟消息循环','ops-incident',true):state.opsStep===1?button('模拟隔离修复','ops-repair',true):state.opsStep===2?button('查看恢复结果','ops-recover',true):button('回到正常演示','ops-reset')}${state.opsStep===3?file('事故报告示例','怎么修、怎么验证、哪些目标被恢复','ops-report'):''}</div>`;
      }
      function render(){
        for(const nav of root.querySelectorAll('[data-nav]')){
          if(nav.dataset.nav===state.nav)nav.setAttribute('aria-current','page');else nav.removeAttribute('aria-current');
        }
        root.querySelector('[data-count="all"]').textContent=String(goals().length);
        root.querySelector('[data-count="attention"]').textContent=state.choice?'0':'1';
        let html;
        if(state.document)html=documentView();
        else if(state.selected==='new'||state.selected==='supplement')html=compose(state.selected==='new');
        else if(state.selected==='speaker')html=speaker();
        else if(state.selected==='recording')html=recording();
        else if(state.selected==='latency')html=latency();
        else if(state.selected?.startsWith('new-')){const goal=goals().find(g=>g.id===state.selected);html=goal?heading(goal)+`<p class="ct-desc">${safe(goal.title)}</p><p class="ct-notice">需求仅保存在本次演示中，尚未派发给真实 leader。</p>`:cards();}
        else if(state.nav==='documents')html=`<div class="ct-heading"><div><h2>交付物</h2><p class="ct-sub">每轮最终交付必须有 HTML、可视化与具体例子。</p></div></div>${file('声纹阶段交付报告','本轮未达标 · 三个 example 与验收边界','speaker-report')}${file('运维事故报告示例','消息循环 → 隔离修复 → 核对恢复','ops-report')}<p class="ct-footnote">声纹结论引用旧记录；报告图示和运维流程均为明确标注的示意。</p>`;
        else if(state.nav==='members')html=memberChat();
        else if(state.nav==='context')html=contextView();
        else if(state.nav==='operations')html=operationsView();
        else html=cards();
        main.innerHTML=html;icons();
      }
      root.addEventListener('click',event=>{
        const trigger=event.target.closest('button');if(!trigger||!root.contains(trigger))return;
        const nav=trigger.dataset.nav,action=trigger.dataset.act;
        if(nav){state.nav=nav;state.selected=null;state.document=null;}
        else if(action==='back'){state.selected=null;state.document=null;state.draft='';}
        else if(action==='open'){state.selected=trigger.dataset.id;state.tab='outcome';state.document=null;}
        else if(action==='tab')state.tab=trigger.dataset.tab;
        else if(action==='why')state.step=1;
        else if(action==='privacy')state.step=2;
        else if(action==='options')state.step=3;
        else if(action==='discuss'){state.step=1;announce('演示回到说明阶段；真实使用时可继续和 leader 讨论。');}
        else if(action==='confirm'){state.choice=state.option;announce('演示：这项决定已记录，“需要你”已清零。没有操作真实录音或任务。');}
        else if(action==='pause'){state.paused=true;announce('演示：本轮已暂停，没有中断真实进程。');}
        else if(action==='resume'){state.paused=false;announce('演示：目标恢复为推进中，没有启动真实成员。');}
        else if(action==='new'){state.selected='new';state.draft='';}
        else if(action==='supplement'){state.selected='supplement';state.draft='';}
        else if(action==='save-draft'){
          const form=root.querySelector('#ct-form');if(!form.reportValidity())return;
          const value=form.querySelector('#ct-draft').value.trim();if(!value)return;
          if(state.selected==='new'){state.custom.push(value);state.selected='new-'+(state.custom.length-1);state.nav='goals';announce('已加入本地演示目标，没有启动任何 AI。');}
          else{state.supplements.push(value);state.selected='speaker';announce('补充已保存在演示中，没有发送给真实 leader。');}
          state.draft='';
        }
        else if(action==='document')state.document=trigger.dataset.doc;
        else if(action==='report-case')state.reportCase=Number(trigger.dataset.index);
        else if(action==='member-chat'||action==='leader-chat'){state.nav='members';state.selected=null;state.document=null;state.chatOwner=action==='leader-chat'?'leader':'member';state.runtimePreview=false;}
        else if(action==='chat-leader'||action==='chat-member'){state.chatOwner=action==='chat-leader'?'leader':'member';state.runtimePreview=false;}
        else if(action==='chat-question'||action==='chat-change'||action==='chat-send'){
          let text,changed=action==='chat-change';
          if(action==='chat-question')text='你现在验证的是哪一种情况？';
          else if(changed)text='先测冷启动，热启动放后面。';
          else{const form=root.querySelector('#ct-member-form');if(!form.reportValidity())return;text=form.querySelector('textarea').value.trim();if(!text)return;}
          const reply=changed?'收到。我会先复验冷启动，把热启动放到后面；这次顺序变更写回当前目标，leader 后续读取。':action==='chat-question'?'我正在对比同一输入的冷启动和热启动，核对启动、加载、首句输出各段等待。回答后继续当前验证。':'这是预设演示回复：实际产品中，同一 AI 会读取你的补充，先回应，再判断继续还是调整工作。';
          const key=state.chatOwner==='leader'?'leaderNotes':'memberNotes';state[key].push({text,reply,changed});state[key]=state[key].slice(-3);state.chatDrafts[state.chatOwner]='';announce('仅追加预设演示对话，没有发送给真实 AI。');
        }
        else if(action==='runtime-preview')state.runtimePreview=true;
        else if(action==='runtime-cancel')state.runtimePreview=false;
        else if(action==='runtime-confirm'){const key=state.chatOwner==='leader'?'leaderRuntime':'runtime';state[key]=state[key]==='codex'?'claude':'codex';state.runtimePreview=false;announce('只更改当前演示对象的载体标签，没有启动、切换或停止真实会话。');}
        else if(action==='memory-outdated'){state.memoryPending=true;announce('演示：纠正已保存，尚未应用到下一次装载。');}
        else if(action==='memory-apply'){state.memoryExcluded=true;state.memoryPending=false;announce('演示：下次上下文排除过期条目，原始历史保留。');}
        else if(action==='ops-incident')state.opsStep=1;
        else if(action==='ops-repair')state.opsStep=2;
        else if(action==='ops-recover')state.opsStep=3;
        else if(action==='ops-reset')state.opsStep=0;
        else return;
        render();remember();
      });
      root.addEventListener('change',event=>{if(event.target.name==='ct-recording-choice'){state.option=event.target.value;remember();}});
      root.addEventListener('input',event=>{if(event.target.id==='ct-draft')state.draft=event.target.value;if(event.target.id==='ct-member-message')state.chatDrafts[state.chatOwner]=event.target.value;});
      root.addEventListener('submit',event=>event.preventDefault());
      restore(window.openai?.widgetState);render();
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();remember();}});tweak.addToggle(display,'showProgress',{label:'首页显示最近有效进展'});}
    })();
  </script>
</div>
