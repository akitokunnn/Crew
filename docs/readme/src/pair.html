<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script>const q=new URLSearchParams(location.search);document.documentElement.dataset.theme=q.get('theme')||'light'</script>
<style>
body{width:1280px}
:root{--bg1:#E3EFEB;--bg2:#F2EADC}
.canvas{width:1280px;padding:44px 64px 56px;background:linear-gradient(160deg,var(--bg1),var(--paper) 52%,var(--bg2));display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.grid{-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
.col{position:relative}
.lab{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink);margin:0 0 14px 4px}
.lab i{width:9px;height:9px;border-radius:50%}
.lab span{font-weight:400;color:var(--muted);font-size:14px}
.panel{background:#F6F5F1;border-radius:16px;padding:14px;box-shadow:0 0 0 1px rgba(44,43,39,.10),0 2px 4px rgba(0,0,0,.05),0 24px 50px -20px rgba(30,30,28,.35)}
.panel img{display:block;width:100%}
</style></head><body><div class="canvas"><div class="grid"></div>
<div class="col"><div class="lab"><i style="background:#B07A26"></i>拍板<span>背景、建议和每个选项的后果都讲清楚</span></div><div class="panel"><img id="a"></div></div>
<div class="col"><div class="lab"><i style="background:#6A5FA8"></i>我的待办<span>要你亲手做的事，做完回到原任务</span></div><div class="panel"><img id="b"></div></div>
</div><script>a.src=q.get('a');b.src=q.get('b')</script></body></html>
