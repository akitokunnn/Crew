<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crew · 390px 前端预览</title>
    <style>
      body {
        margin: 0;
        background: #dedfd9;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font: 13px system-ui;
        color: #555;
      }
      main {
        display: grid;
        gap: 10px;
        padding: 18px;
      }
      p {
        margin: 0;
        text-align: center;
      }
      iframe {
        border: 1px solid #aaa7;
        border-radius: 18px;
        width: 390px;
        height: 844px;
        max-width: calc(100vw - 24px);
        background: #f6f5f1;
        box-shadow: 0 12px 60px #0002;
      }
    </style>
  </head>
  <body>
    <main>
      <p>390px 窄屏预览 · 开发用样例</p>
      <iframe title="手机 Crew" src="/?data=mock"></iframe>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const frame = document.querySelector("iframe");
      const target = new URL("/", location.origin);
      target.searchParams.set("data", "mock");
      if (query.has("scenario"))
        target.searchParams.set("scenario", query.get("scenario"));
      target.hash = location.hash || "#home";
      frame.src = target.href;
    </script>
  </body>
</html>
