<body>
  <div class="app" id="app">
    <aside class="sb" id="sidebar" aria-label="工作区导航"></aside>
    <main class="main" id="main" aria-label="工作区内容"></main>
    <aside class="goal-drawer" id="goal-drawer" aria-label="当前目标资料" hidden></aside>
  </div>
  <div id="overlay-root"></div>
  <aside id="chat-attention" class="chat-sidepanels" aria-label="本组工作" hidden>
    <div id="attention-slot" class="attention-slot" data-open="false" aria-hidden="true" inert>
      <section id="side-attention-section" class="attention-panel" aria-labelledby="attention-title">
        <header class="attention-head"><div><h2 id="attention-title">待你处理 <span id="side-attention-count"></span></h2><p id="attention-scope"></p></div><button type="button" class="icon-btn" data-act="side-section-close" data-section="attention" aria-label="收起待处理">−</button></header>
        <div class="attention-scroll"><div id="native-approval-tray"></div><div id="decision-tray"></div><p id="attention-empty" class="attention-empty">这里暂时没有待处理事项</p></div>
      </section>
    </div>
    <aside class="rp" id="right-panel" aria-label="本组架构图" hidden></aside>
  </aside>
  <aside id="side-task-section" class="task-tools-panel" role="dialog" aria-labelledby="side-task-title" hidden>
    <header class="attention-head"><div><h2 id="side-task-title">任务资料</h2></div><button type="button" class="icon-btn" data-act="side-section-close" data-section="tasks" aria-label="关闭任务资料">×</button></header>
    <div id="side-task-body" class="task-tools-scroll"></div>
  </aside>
  <section id="settings-surface" aria-label="Crew 设置" hidden></section>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
</body>
