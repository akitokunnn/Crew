<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Crew</title>
<style>html{color-scheme:light dark;font:16px/1.6 system-ui,sans-serif}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f7f7f5;color:#242722}main{box-sizing:border-box;width:min(100%,420px);padding:30px}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}p{color:#5a6258}label{display:block;margin:24px 0 8px}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:13px 16px}input{border:1px solid #abb3a7;background:transparent;color:inherit;font-size:24px;letter-spacing:.15em}button{margin-top:20px;border:0;background:#355b42;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:26px;color:#a13926}.note{font-size:13px}@media(prefers-color-scheme:dark){body{background:#1e211d;color:#edf0ea}p{color:#b1b8ac}#status{color:#ffb2a4}}</style></head>
<body><main><h1>连接你的 Crew</h1><p>在电脑上的 Crew 设置中生成配对码，再输入下方。每个配对码只能使用一次，5 分钟内有效。</p><form><label for="code">8 位配对码</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required autofocus><button type="submit">连接</button><p id="status" role="status" aria-live="polite"></p></form><p class="note">局域网连接未加密，请只在你信任的网络中使用。配对后可在电脑上随时移除设备。</p></main>
<script>
'use strict';
const form=document.querySelector('form'),button=form.querySelector('button'),status=document.querySelector('#status');
function nextPath(){const value=new URLSearchParams(location.search).get('next')||'/';try{const next=new URL(value,location.origin);if(next.origin!==location.origin||!value.startsWith('/')||value.startsWith('//')||value.includes('\\'))return '/';return next.pathname+next.search+(next.hash||location.hash);}catch{return '/';}}
form.onsubmit=async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.textContent='正在连接…';try{const response=await fetch('/remote/login',{method:'POST',headers:{'Content-Type':'application/json','X-Crew':'1'},body:JSON.stringify({code:document.querySelector('#code').value,next:nextPath(),device_name: /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent)?'手机浏览器':'电脑浏览器'})});const value=await response.json();if(!response.ok)throw Error(value.error||'连接失败，请重新检查配对码');location.assign(value.next);}catch(error){status.textContent=error.message;button.disabled=false;}};
</script></body></html>
