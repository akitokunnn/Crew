<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>作战室 · 登录接口签名 v2 联调（原型）</title>
  <script>
    // ?theme=dark|light 固定主题，不带就跟随系统；?shot 隐藏原型控制条
    (function () {
      var p = new URLSearchParams(location.search), t = p.get("theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      if (p.has("shot")) document.documentElement.classList.add("wr-shot");
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../../frontend/logo.svg">
  <link rel="stylesheet" href="../../frontend/style.css">
  <link rel="stylesheet" href="../../frontend/channel.css">
  <link rel="stylesheet" href="war-room.css">
</head>
<body>
  <div class="wr-app" id="wr-app">
    <nav class="wr-rail" aria-label="应用导航（占位）"></nav>
    <main class="wr-main" id="wr-room" aria-labelledby="wr-title"></main>
  </div>
  <div class="wr-backdrop wr-layer" id="wr-backdrop" hidden></div>
  <div class="wr-sheet wr-layer" id="wr-member-sheet" role="dialog" aria-modal="true" aria-labelledby="wr-ms-title" hidden></div>
  <div class="wr-dialog wr-layer" id="wr-dialog" role="dialog" aria-modal="true" aria-labelledby="wr-dialog-title" hidden></div>
  <div class="wr-menu wr-layer" id="wr-menu" role="menu" hidden></div>
  <div class="wr-toast wr-layer" id="wr-toast" role="status" aria-live="polite" hidden></div>
  <div class="wr-proto" aria-label="原型控制">
    <span>原型</span>
    <button type="button" class="cx-btn" data-proto="open">进行中</button>
    <button type="button" class="cx-btn" data-proto="closed">已收尾</button>
    <button type="button" class="cx-btn" data-proto="theme">切换深浅</button>
    <a class="cx-btn" href="entry.html" style="text-decoration:none">入口小样</a>
  </div>
  <script src="app.js"></script>
</body>
</html>
