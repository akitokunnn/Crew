<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#f6f5f1" />
    <title>Crew · 交互原型</title>
    <link rel="icon" href="crew.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="settings.css" />
    <script src="data.js" defer></script>
    <script src="state.js" defer></script>
    <script src="settings.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app" class="shell">
      <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
      <div id="nav-backdrop" class="nav-backdrop" hidden></div>
      <main id="main" tabindex="-1"></main>
      <aside
        id="inspector"
        class="inspector"
        aria-label="任务资料"
        hidden
      ></aside>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript
      >这个可点击原型需要启用 JavaScript。全部内容均为样例数据。</noscript
    >
  </body>
</html>
