name: Crew tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'desktop/README.md'
      - 'docs/**/*.md'
      - 'docs/prototypes/**'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'desktop/README.md'
      - 'docs/**/*.md'
      - 'docs/prototypes/**'

permissions:
  contents: read

concurrency:
  group: crew-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use a canonical isolated temporary directory
        run: |
          @'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']).resolve() / 'crew-tests'
          directory.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('TEMP', 'TMP'):
                  print(f'{name}={directory}', file=output)
          '@ | python -
      - name: Backend tests with isolated homes and fake carriers
        working-directory: plugin
        run: |
          foreach ($name in 'CREW_SESSION_ID','CLAUDE_CODE_SESSION_ID','CREW_EXECUTION_ID','CREW_GOAL_ID') {
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
          }
          python -m unittest discover -s tests --durations 10

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use a canonical isolated temporary directory
        run: |
          @'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']).resolve() / 'crew-tests'
          directory.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('TEMP', 'TMP'):
                  print(f'{name}={directory}', file=output)
          '@ | python -
      - name: Browser unit tests
        if: ${{ !cancelled() }}
        run: node --test plugin/tests/test_*.js
      - name: Install desktop dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix desktop ci
      - name: Desktop unit tests
        if: ${{ !cancelled() }}
        run: npm --prefix desktop test
      - name: Isolated workspace interaction
        if: ${{ !cancelled() }}
        env:
          CREW_TEST_SHOW_WINDOW: '1'
        run: node desktop/scripts/smoke-workspaces.cjs
      - name: Isolated conversation and task routing
        if: ${{ !cancelled() }}
        run: node plugin/tests/smoke_conversation_routing.cjs
      - name: Real task workbench on desktop and mobile viewports
        if: ${{ !cancelled() }}
        run: node plugin/tests/smoke_task_workbench.cjs
