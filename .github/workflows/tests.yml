name: Crew tests

# 日常修复先合入本地 live 集成分支试用，攒一批再通过一个 PR 合进 main。
# CI 只在这个批次 PR 上跑一次；合进 main 后不再重复跑。需要时也可手动触发。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crew-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use a canonical isolated temporary directory
        run: |
          @'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']).resolve() / 'crew-tests'
          directory.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('TEMP', 'TMP'):
                  print(f'{name}={directory}', file=output)
          '@ | python -
      # CI only runs the core list in plugin/tests/ci_core.txt; run the full suite locally before merging.
      - name: Core backend tests with isolated homes and fake carriers
        working-directory: plugin
        run: |
          foreach ($name in 'CREW_SESSION_ID','CLAUDE_CODE_SESSION_ID','CREW_EXECUTION_ID','CREW_GOAL_ID') {
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
          }
          python tests/ci_core.py -v

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use a canonical isolated temporary directory
        run: |
          @'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']).resolve() / 'crew-tests'
          directory.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('TEMP', 'TMP'):
                  print(f'{name}={directory}', file=output)
          '@ | python -
      - name: Browser unit tests
        if: ${{ !cancelled() }}
        run: node --test plugin/tests/test_*.js
      - name: Install desktop dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix desktop ci
      - name: Desktop unit tests
        if: ${{ !cancelled() }}
        run: npm --prefix desktop test
      - name: Isolated workspace interaction
        if: ${{ !cancelled() }}
        env:
          CREW_TEST_SHOW_WINDOW: '1'
        run: node desktop/scripts/smoke-workspaces.cjs
      - name: Isolated conversation and task routing
        if: ${{ !cancelled() }}
        run: node plugin/tests/smoke_conversation_routing.cjs
